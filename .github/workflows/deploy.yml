name: CI/CD Pipeline — Pymetory

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Syntax Check ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP Syntax Check
        run: |
          find app routes config database -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | grep -v "No syntax" | grep -qc "error" && exit 1 || exit 0

  # ── 2. Run Unit & Feature Tests ──
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite3

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress

      - name: Install npm Dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build Frontend Assets (Vite manifest required by Inertia tests)
        run: npm run build

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing
        run: php artisan test --stop-on-failure

  # ── 3. Deploy to DesktopTitan (Oracle Cloud) ──
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DESKTOPTITAN_HOST }}
          port: ${{ secrets.DESKTOPTITAN_PORT }}
          username: ${{ secrets.DESKTOPTITAN_USER }}
          key: ${{ secrets.DESKTOPTITAN_KEY }}
          script: |
            cd /var/www/portafolio/SolucionesWeb/pymetoryTesis
            # FIX-CI: el repo clonado en Titan usa https sin credenciales => git pull fallaba
            # "could not read Username". Se autentica con token efimero de este run
            # (repo privado; token nunca se escribe a disco).
            git remote set-url origin https://x-access-token:${{ secrets.DEPLOY_GH_TOKEN }}@github.com/germanmurillas/gestor-inventario-pymes-llm.git
            sudo git pull origin main
            sudo composer install --no-dev --optimize-autoloader --no-interaction
            sudo php artisan migrate --force
            sudo chown -R www-data:www-data .
            echo "✅ Deploy completado"

