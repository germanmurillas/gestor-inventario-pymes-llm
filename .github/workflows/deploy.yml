name: CI/CD Pipeline — Pymetory

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Syntax Check ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP Syntax Check
        run: |
          ERRORS=$(find app routes config database -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax" | grep -c "." || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS lines with syntax issues:"
            find app routes config database -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax"
            exit 1
          fi
          echo "All PHP files pass syntax check"

  # ── 2. Deploy to DesktopTitan (Oracle Cloud) ──
  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DESKTOPTITAN_HOST }}
          port: ${{ secrets.DESKTOPTITAN_PORT }}
          username: ${{ secrets.DESKTOPTITAN_USER }}
          key: ${{ secrets.DESKTOPTITAN_KEY }}
          script: |
            cd /var/www/portafolio/SolucionesWeb/pymetoryTesis
            sudo git pull origin main
            sudo composer install --no-dev --optimize-autoloader --no-interaction
            sudo php artisan migrate --force
            sudo chown -R www-data:www-data .
            pkill -f "artisan serve" || true
            sudo -u www-data nohup php artisan serve --host=127.0.0.1 --port=8081 > /tmp/artisan-serve.log 2>&1 &
            echo "✅ Deploy completado"
