name: CI/CD Pipeline — Pymetory

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint & Syntax Check ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP Syntax Check
        run: |
          find app routes config database -name "*.php" -print0 | xargs -0 -n1 php -l 2>&1 | grep -v "No syntax" | grep -qc "error" && exit 1 || exit 0

  # ── 2. Run Unit & Feature Tests ──
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite3

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-progress

      - name: Install npm Dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build Frontend Assets (Vite manifest required by Inertia tests)
        run: npm run build

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing
        run: php artisan test --stop-on-failure

  # ── 3. Despliegue en el servidor (Oracle Cloud) ──
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Cualquier error detiene el despliegue y marca el job como fallido
            # (antes un git pull fallido terminaba igual en "Deploy completado").
            set -e
            # Respaldo comprimido de la base antes de migrar; si sale vacío (ya pasó: 154 bytes) no se migra.
            respaldar() {
              BASE=$(sudo grep -E '^DB_DATABASE=' .env | cut -d= -f2)
              sudo mkdir -p /var/backups/pymetory
              F=/var/backups/pymetory/$BASE-antes-de-migrar-$(date +%Y%m%d-%H%M%S).sql.gz
              sudo bash -c "set -o pipefail; mysqldump --single-transaction --routines --triggers '$BASE' | gzip > '$F'"
              if [ "$(sudo stat -c%s "$F")" -lt 5000 ]; then echo "Respaldo de $BASE vacío: no se migra"; exit 1; fi
              sudo find /var/backups/pymetory -name "$BASE-antes-de-migrar-*" -mtime +14 -delete
              echo "Respaldo $F ($(sudo stat -c%s "$F") bytes)"
            }
            cd /var/www/portafolio/SolucionesWeb/pymetoryTesis
            # Repositorio público: el servidor actualiza sin credenciales.
            sudo git remote set-url origin https://github.com/germanmurillas/gestor-inventario-pymes-llm.git
            sudo git pull --ff-only origin main
            sudo composer install --no-dev --optimize-autoloader --no-interaction
            respaldar
            sudo php artisan migrate --force
            sudo chown -R www-data:www-data .
            # Cachés de configuración y rutas con el código nuevo; PHP-FPM toma los archivos cambiados.
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:clear
            # Instancia de la empresa (bodega.pymetory.com): mismo código, su propia base y su .env.
            if [ -d /var/www/bodega-pymetory ]; then
              cd /var/www/bodega-pymetory
              sudo git pull --ff-only origin main
              sudo composer install --no-dev --optimize-autoloader --no-interaction
              respaldar
              sudo php artisan migrate --force
              sudo chown -R www-data:www-data .
              sudo -u www-data php artisan config:cache
              sudo -u www-data php artisan route:cache
              sudo -u www-data php artisan view:clear
            fi
            sudo systemctl reload php8.3-fpm
            echo "✅ Deploy completado"

