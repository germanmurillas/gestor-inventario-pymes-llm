<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — Pymetory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --obsidiana: #0A0A0B;
      --indigo: #6366F1;
      --indigo-glow: #818CF8;
      --champan: #C9A84C;
      --slate: #0F172A;
      --slate-light: #1E293B;
      --text: #E2E8F0;
      --text-muted: #94A3B8;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--obsidiana);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99,102,241,0.08), transparent);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 120%, rgba(99,102,241,0.04), transparent);
      pointer-events: none;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .card {
      background: linear-gradient(135deg, var(--slate-light) 0%, var(--slate) 100%);
      border: 1px solid rgba(99,102,241,0.15);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 17px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99,102,241,0.3), transparent 40%, transparent 60%, rgba(201,168,76,0.15));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .icon-offline {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: rgba(99,102,241,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-offline svg {
      width: 36px;
      height: 36px;
      stroke: var(--indigo);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #F1F5F9;
      text-transform: uppercase;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      padding: 0.625rem 1rem;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.15);
      border-radius: 8px;
      font-size: 0.8125rem;
      color: #FCA5A5;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 8px rgba(239,68,68,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: var(--indigo);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99,102,241,0.25);
    }

    .btn-retry:hover {
      background: var(--indigo-glow);
      box-shadow: 0 6px 20px rgba(99,102,241,0.35);
      transform: translateY(-1px);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .btn-retry svg {
      width: 18px;
      height: 18px;
    }

    .offline-cached {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .offline-cached a {
      color: var(--champan);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .offline-cached a:hover {
      color: #E2C87A;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
    }

    footer span {
      font-size: 0.75rem;
      color: rgba(148,163,184,0.4);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon-offline">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
    </svg>
  </div>

  <h1>Sin conexión</h1>

  <div class="status-bar">
    <span class="status-dot"></span>
    No se detecta conexión a internet
  </div>

  <p>
    Pymetory necesita conexión para cargar datos actualizados. Verifica tu red Wi-Fi o datos móviles e intenta de nuevo.
  </p>

  <button class="btn-retry" onclick="window.location.reload()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/>
    </svg>
    Reintentar
  </button>

  <div class="offline-cached">
    <a href="/">Ir al inicio</a>
  </div>
</div>

<footer>
  <span>Pymetory Premium &mdash; v1.0</span>
</footer>

</body>
</html>
