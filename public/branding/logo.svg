<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#151520"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A0E0"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c880"/>
      <stop offset="100%" stop-color="#00A0E0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="230" fill="url(#bg)" stroke="#1e1e35" stroke-width="2"/>
  
  <!-- P letter - stylized inventory box -->
  <g transform="translate(130, 100)">
    <!-- Box outline -->
    <rect x="0" y="40" width="160" height="160" rx="16" fill="none" stroke="url(#icon)" stroke-width="8"/>
    <!-- Box lid -->
    <path d="M0,40 L80,0 L160,40" fill="none" stroke="url(#icon)" stroke-width="8" stroke-linecap="round"/>
    <!-- P letter inside -->
    <text x="80" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="90" font-weight="900" fill="url(#icon)" letter-spacing="-2">P</text>
    <!-- FEFO arrow -->
    <path d="M30,210 L80,170 L130,210" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="210" r="6" fill="url(#accent)"/>
  </g>
  
  <!-- Orbit ring - AI/LLM -->
  <ellipse cx="270" cy="400" rx="140" ry="12" fill="none" stroke="#00c880" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 6"/>
  <circle cx="200" cy="400" r="5" fill="#00c880" opacity="0.8"/>
  
  <!-- Small particles -->
  <circle cx="120" cy="80" r="2" fill="#00c8ff" opacity="0.6"/>
  <circle cx="380" cy="60" r="2.5" fill="#C8A800" opacity="0.5"/>
  <circle cx="420" cy="140" r="1.5" fill="#8844cc" opacity="0.6"/>
  <circle cx="100" cy="350" r="2" fill="#00A0E0" opacity="0.5"/>
</svg>